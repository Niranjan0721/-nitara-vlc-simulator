name: Build Mac App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install PyQt5 pyserial pyinstaller

      - name: Build Mac app
        run: |
          python -m PyInstaller --onefile --windowed --name NC_Simulator main.py

      - name: Create DMG
        run: |
          mkdir -p dmg_contents
          cp -r dist/NC_Simulator.app dmg_contents/
          hdiutil create -volname "NC_Simulator" -srcfolder dmg_contents -ov -format UDZO NC_Simulator.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: NC_Simulator-Mac-DMG
          path: NC_Simulator.dmg
          retention-days: 3
