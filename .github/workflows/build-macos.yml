name: Build macOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual trigger

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt5 pyserial pyinstaller

    - name: Build macOS App
      run: |
        pyinstaller --onefile --windowed --name "NC_Simulator" \
          --osx-bundle-identifier "com.nitara.vlcsimulator" \
          main.py

    - name: Create DMG
      run: |
        hdiutil create -volname "NC Simulator" -srcfolder dist/NC_Simulator.app -ov -format UDZO NC_Simulator.dmg

    - name: Upload App Bundle
      uses: actions/upload-artifact@v4
      with:
        name: NC_Simulator-macOS-App
        path: dist/NC_Simulator.app

    - name: Upload DMG
      uses: actions/upload-artifact@v4
      with:
        name: NC_Simulator-macOS-DMG
        path: NC_Simulator.dmg
